name: Plugin CI (App Store)

# Runs Signal K's reusable plugin-CI workflow so per-platform install / load /
# activate results show up in the App Store "Indicators" tab. This is separate
# from ./ci.yml, which is the project's own format / lint / typecheck / test /
# coverage CI. Same caller as signalk-parquet, except armv7 (Venus OS / Cerbo
# GX, 32-bit ARM) stays on: this plugin has no native dependencies.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin-ci:
    permissions:
      contents: read
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@ac4e1c0b42294d0bb464b4864372803a077fa84c # master 2026-07-17
    with:
      test-command: 'npm test'
      build-command: 'npm run build'
      format-check-command: 'npm run format:check'
      enable-armv7: true
      enable-signalk-integration: true
